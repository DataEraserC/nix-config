# Profile-level DSH patch for nix-web-acb (dsh.nix key `web-acb`): rows that
# apply only to this profile, layered above the home file
# ($DSH_HOME/cordis.patch.yml) and below CLI overlays. Nix is the source of
# truth: programs.dsh.patch reads this file at build time, so the managed
# profile file is a store snapshot of it - edit here, run `just local`, then
# restart dsh. In-place edits (Settings UI or $DSH_HOME/profiles/...) are
# reverted to the snapshot on the next launch, by design (managed fingerprint).
#
# Deliberately empty: the ACB presets and their MCP clients are a dsh bundle
# (`acb-presets`), not profile patch rows, so this file stays the plain
# `web` composition. Model/provider rows belong to the Settings UI / home
# layer and are not overridden here.
[]
