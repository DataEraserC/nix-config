%YAML 1.1
---
# Profile-level DSH patch for nix-web-acb (dsh.nix key `web-acb`): rows that
# apply only to this profile, layered above the home file
# ($DSH_HOME/cordis.patch.yml) and below CLI overlays. Nix is the source of
# truth: programs.dsh.patch reads this file at build time, so the managed
# profile file is a store snapshot of it - edit here, run `just local`, then
# restart dsh. In-place edits (Settings UI or $DSH_HOME/profiles/...) are
# reverted to the snapshot on the next launch, by design (managed fingerprint).
#
# graph-memory is a profile-level plugin: it observes every session in this
# profile, including the ACB chats. Disabling the row here keeps ACB traffic
# out of its graph. Only the fields below are replaced; the plugin's own
# config is left untouched, so re-enabling the row needs no restatement.
#
# The ACB presets and their MCP clients are a dsh bundle (`acb-presets`), not
# profile patch rows. Model/provider rows come from web-shared.yml (the same
# set the nix-web-qq profile runs), supplied through repoPatch.
# @SHARED@
- id: graph-memory
  disabled: true
