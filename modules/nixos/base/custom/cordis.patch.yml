# Home-level DSH patch ($DSH_HOME/cordis.patch.yml): machine-wide rows that
# apply under every profile layer. Nix is the source of truth — NixOS activation
# (modules/nixos/base/custom/dsh.nix) symlinks this file into $DSH_HOME, and
# programs.dsh.patch stays null so the dsh seed wrapper never rewrites that
# symlink on launch. Edit here, then rebuild and switch. Rows carry only
# credential references (`apiKeyEnv`): key values live in
# $DSH_HOME/.credentials.yaml (mode 600) and never enter the store.
